# 复制为 config/config.yaml 后填写下列字段。
# 桌面发布包：同内容已打入二进制（internal/proxy/bundled_config.yaml），若需改默认请与该文件一并维护同步。
# LEIAGENT_CONFIG_PATH 可指向自定义 YAML 路径。
#
# 只配置一个 OpenAI-compatible Chat Completions 接口。
# api_key 可留空（例如无鉴权的本地服务），也可使用 LEIAGENT_LLM_API_KEY 或 OPENAI_API_KEY。
# 其余字段可由 LEIAGENT_LLM_BASE_URL、LEIAGENT_LLM_MODEL、LEIAGENT_LLM_MAX_OUTPUT_TOKENS 覆盖。
# max_output_tokens 不填时默认 8192；任务规划阶段自动不低于 16384。

# llm:
#   api_key: "your-api-key"
#   base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
#   model: "qwen-plus"
#   max_output_tokens: 32768

# 可选：配置 MCP 服务器，供 list_mcp_tools / call_mcp_tool 使用。
# 安全默认值：allowed_tools 必须显式列出可调用工具；空数组表示禁止 call_mcp_tool。
# mcp_servers:
#   - label: "chrome-devtools"
#     command: "npx"
#     args:
#       - "-y"
#       - "chrome-devtools-mcp@latest"
#       - "--browser-url=http://127.0.0.1:9222"
#       - "--isolated=false"
#     transport_type: "stdio"
#     allowed_tools: ["list_pages", "take_snapshot"]
#
#   - label: "my-http-mcp"
#     url: "http://127.0.0.1:3001"
#     transport_type: "streamable_http"
#     allowed_tools: ["search_docs", "lookup_user"]
#     headers:
#       Authorization: "Bearer your-token"

# 可选：OpenClaw/ClawHub skill 运行环境变量。
# 桌面应用从图标启动时通常不会继承 shell 里的 export，所以第三方 skill 的 API Key
# 推荐写在这里，leiAgent 会在校验和执行 skill 脚本时注入。
# openclaw:
#   env:
#     BAIDU_API_KEY: "your-baidu-ai-search-api-key"


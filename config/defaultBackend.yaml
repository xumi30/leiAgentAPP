# 内置默认 LLM 后端（enable_llm_config: false 时使用）。
# 可复制并改用 config/config.yaml + enable_llm_config: true 做高级配置。
# api_key 可留空并依赖环境变量 LEIAGENT_LLM_API_KEY 等。
llm:
  name: builtin-qwen
  api_key: "your-api-key"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
  model: "qwen3.5-plus-2026-02-15"
  provider: ""
  stream_mode: both

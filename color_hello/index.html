<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>变色 Hello World</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-size: 3em;
      font-weight: bold;
      transition: color 0.5s ease;
    }
  </style>
</head>
<body>
  <div id="hello">Hello World</div>
  <script>
    const colors = [
      '#FF5733', '#33FF57', '#3357FF', '#F3FF33',
      '#FF33F3', '#33FFF3', '#F333FF', '#FF8C33'
    ];
    const hello = document.getElementById('hello');
    let i = 0;
    setInterval(() => {
      hello.style.color = colors[i % colors.length];
      i++;
    }, 500);
  </script>
</body>
</html>
